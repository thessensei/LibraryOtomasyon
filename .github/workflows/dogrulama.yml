name: Proje doğrulaması
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: WinForms çözümünü derle
        run: msbuild MttSinema.sln -restore -p:Configuration=Release
      - name: Veritabanı ve gişe akışını sına
        run: .\tests\MttSinema.Testler\bin\Release\net472\MttSinema.Testler.exe
      - name: Şema testleri
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Kaynak paketi güncel mi?
        run: python araclar/paketle.py --kontrol
